<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>データ管理</title>
<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --text: #1f1f1c; --muted: #6b6b66; --line: #e3e2dc; --row: #fafaf7;
    --ok: #2f7d4f; --ok-bg: #e6f3eb; --warn: #9a6200; --warn-bg: #fdf1dc; --err: #b3261e; --err-bg: #fbe5e3;
    --info: #4a5a78; --info-bg: #eceff5;
    --accent: #2858c9; --accent-bg: #e8eefc; --chip: #f0efea; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1d; --text: #ecebe6; --muted: #9b9a93; --line: #34332f; --row: #242422;
      --ok: #6fcf97; --ok-bg: #1d3326; --warn: #f2b84b; --warn-bg: #3a2e14; --err: #f28b82; --err-bg: #3d1f1d;
      --info: #a8b8d8; --info-bg: #252b38;
      --accent: #8ab4f8; --accent-bg: #1f2a40; --chip: #2a2a27;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  header { padding: 20px 24px 8px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 12px; }
  .legend { padding: 0 24px 14px; color: var(--muted); font-size: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; background: var(--chip); white-space: nowrap; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.err { background: var(--err-bg); color: var(--err); }
  .pill.info { background: var(--info-bg); color: var(--info); }
  button { font: inherit; font-size: 12px; padding: 5px 11px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.08); }
  button.danger:hover:not(:disabled) { border-color: var(--err); color: var(--err); }
  button.link { border: none; background: none; color: var(--accent); padding: 2px 0; }
  button:disabled { opacity: .4; cursor: default; }
  main { padding: 0 24px 24px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 500px), 1fr)); align-items: start; }
  body.logopen main { padding-bottom: 290px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .card-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .card h2 { font-size: 15px; margin: 0; }
  .id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .fact .k { font-size: 11px; color: var(--muted); }
  .fact .v { font-variant-numeric: tabular-nums; font-weight: 600; }
  .fact .s { font-size: 11px; color: var(--muted); }
  .tablewrap { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 600; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); z-index: 1; }
  td { padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr.held td { background: var(--row); }
  td.ed { font-family: var(--mono); }
  .st { display: inline-block; padding: 0 6px; border-radius: 4px; }
  .st.ok { background: var(--ok-bg); color: var(--ok); }
  .st.gone { background: var(--info-bg); color: var(--info); }
  .st.unk { color: var(--muted); }
  .st.new { background: var(--warn-bg); color: var(--warn); }
  .muted { color: var(--muted); }
  input[type=checkbox] { margin: 0; vertical-align: middle; }
  .switch { position: relative; display: inline-block; width: 30px; height: 17px; vertical-align: middle; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .15s; cursor: pointer; }
  .switch span::before { content: ""; position: absolute; width: 13px; height: 13px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .15s; }
  .switch input:checked + span { background: var(--ok); }
  .switch input:checked + span::before { transform: translateX(13px); }
  .switch input:disabled + span { opacity: .5; cursor: default; }
  ul.issues { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  ul.issues li { font-size: 12px; padding: 4px 8px; border-radius: 6px; overflow-wrap: anywhere; }
  ul.issues li.warn { background: var(--warn-bg); color: var(--warn); }
  ul.issues li.error { background: var(--err-bg); color: var(--err); }
  ul.issues li.info { background: var(--info-bg); color: var(--info); }
  details.oks summary { font-size: 12px; color: var(--ok); cursor: pointer; }
  details.oks li { font-size: 12px; color: var(--muted); }
  .note { font-size: 12px; color: var(--muted); }
  .note a { color: var(--accent); }
  .bulk { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
  #logwrap { position: fixed; left: 0; right: 0; bottom: 0; background: #111; border-top: 1px solid #333; z-index: 5; }
  #logwrap[hidden] { display: none; }
  #logbar { display: flex; justify-content: space-between; align-items: center; padding: 6px 24px; color: #999; font-size: 12px; border-bottom: 1px solid #2a2a2a; }
  #logbar button { background: transparent; color: #bbb; border-color: #444; }
  #log { margin: 0; height: 220px; color: #d8d8d0; font: 12px/1.45 var(--mono); padding: 10px 24px; overflow: auto; white-space: pre-wrap; }
  @media (max-width: 560px) {
    header, main, .legend { padding-left: 16px; padding-right: 16px; }
    #log { padding: 10px 16px; height: 180px; }
    #logbar { padding: 6px 16px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>データ管理</h1>
    <div class="sub" id="sub">読み込み中…</div>
  </div>
  <div class="row" id="summary"></div>
</header>
<div class="legend">
  配布元 = 公開されている版（「配布元を確認」で更新） ／ リポジトリ = 取得・生成済みの版 ／ アプリ = サイトで使う版（オンの版だけがアプリに出る）
</div>
<main id="cards"></main>
<div id="logwrap" hidden>
  <div id="logbar"><span id="logtitle">出力</span><button id="logclose" type="button">閉じる</button></div>
  <pre id="log"></pre>
</div>

<script>
const $ = (sel) => document.querySelector(sel)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const linkify = (s) => esc(s).replace(/https?:\/\/[^\s)）]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`)
const kb = (n) => n > 1e6 ? `${(n / 1e6).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`
const when = (iso) => iso ? new Date(iso).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '未確認'

const DISCOVER = { auto: ['自動検出', 'ok'], manual: ['手動登録', 'info'], curated: ['手管理', 'info'] }
const USAGE = { select: 'アプリで選択できる', latest: 'アプリは有効な最新版を使う', latest2: 'アプリは有効な新しい2版から発効済みを使う' }

let busy = false
let state = null
const selected = {}      // dataset → Set(edition id)
const showAll = new Set()

async function load() {
  state = await (await fetch('/api/status')).json()
  busy = Boolean(state.running)
  render()
}

/** Union of A (catalog) and B (held) for one dataset, newest first. */
function rowsOf(id) {
  const held = state.meta.datasets[id]?.editions ?? []
  const cat = state.catalog.datasets[id]
  const rows = new Map()
  for (const e of cat?.editions ?? []) rows.set(e.id, { id: e.id, as_of: e.as_of, label: e.label, size: e.ref?.size, a: e.available === false ? 'gone' : e.available === null ? 'unk' : 'ok', held: null })
  for (const e of held) {
    const r = rows.get(e.id) ?? { id: e.id, as_of: e.as_of, label: e.label, a: cat ? 'gone' : 'unk' }
    rows.set(e.id, { ...r, held: e })
  }
  const newestHeld = held.map(e => e.as_of).sort().at(-1) ?? ''
  return [...rows.values()]
    .map(r => ({ ...r, newer: !r.held && r.a === 'ok' && (r.as_of ?? '') > newestHeld }))
    .sort((x, y) => (y.as_of ?? '').localeCompare(x.as_of ?? '') || y.id.localeCompare(x.id))
}

function render() {
  const { manifest, report, env, catalog } = state
  $('#sub').textContent = `配布元の確認 ${when(catalog.checked_at)} ・ チェック ${when(report.generated_at)} ・ 生データキャッシュ ${kb(state.cacheBytes)}`
  $('#summary').innerHTML = `
    <span class="pill ${report.errors ? 'err' : 'ok'}">エラー ${report.errors}</span>
    <span class="pill ${report.warnings ? 'warn' : 'ok'}">警告 ${report.warnings}</span>
    <span class="pill ${env.estatAppId ? 'ok' : 'warn'}">e-Stat APIキー ${env.estatAppId ? '設定済み' : '未設定'}</span>
    <button data-act="check">チェック再実行</button>
    <button class="primary" data-act="discover" data-ds="all">配布元をすべて確認</button>`

  $('#cards').innerHTML = Object.entries(manifest).map(([id, src]) => card(id, src)).join('')
  setBusy(busy)
}

function card(id, src) {
  const held = state.meta.datasets[id]?.editions ?? []
  const cat = state.catalog.datasets[id]
  const rows = rowsOf(id)
  const sel = selected[id] ??= new Set()
  for (const k of [...sel]) if (!rows.some(r => r.id === k)) sel.delete(k)
  const visible = showAll.has(id) ? rows : rows.filter(r => r.held || r.newer)
  const hidden = rows.length - visible.length
  const newer = rows.filter(r => r.newer)
  const enabled = held.filter(e => e.enabled !== false)
  const bytes = held.reduce((n, e) => n + (e.bytes || 0), 0)

  const results = state.report.results.filter(r => r.dataset === id)
  const issues = results.filter(r => r.level !== 'ok')
  const oks = results.filter(r => r.level === 'ok')
  const level = issues.some(r => r.level === 'error') ? 'err' : issues.some(r => r.level === 'warn') ? 'warn' : 'ok'
  const [dLabel, dCls] = DISCOVER[src.discover] ?? ['?', '']

  const selRows = rows.filter(r => sel.has(r.id))
  const canGet = selRows.length > 0 && selRows.every(r => r.a === 'ok' || r.held) && !(src.single && selRows.length > 1)
  const canHeld = selRows.length > 0 && selRows.every(r => r.held)

  return `
  <section class="card" data-ds="${id}">
    <div class="card-head">
      <div><h2>${esc(src.label)}</h2><div class="id">${esc(id)} ・ ${esc(src.agency)}</div></div>
      <div class="row"><span class="pill ${dCls}">${dLabel}</span><span class="pill ${level}">${level === 'err' ? 'エラー' : level === 'warn' ? '要確認' : 'OK'}</span></div>
    </div>
    <div class="facts">
      <div class="fact"><div class="k">配布元</div><div class="v">${cat ? `${cat.editions.filter(e => e.available !== false).length} 版` : '—'}</div><div class="s">${cat?.error ? '確認失敗' : when(cat?.checked_at)}</div></div>
      <div class="fact"><div class="k">リポジトリ</div><div class="v">${held.length} 版</div><div class="s">${bytes ? kb(bytes) : '—'}</div></div>
      <div class="fact"><div class="k">アプリ</div><div class="v">${enabled.length} 版</div><div class="s">${esc(USAGE[src.usage] ?? '')}</div></div>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th><input type="checkbox" data-selall="${id}" ${visible.length && visible.every(r => sel.has(r.id)) ? 'checked' : ''} aria-label="すべて選択"></th>
          <th>版</th><th>配布元</th><th>リポジトリ</th><th>アプリ</th>
        </tr></thead>
        <tbody>
        ${visible.map(r => `
          <tr class="${r.held ? 'held' : ''}">
            <td><input type="checkbox" data-sel="${id}" value="${esc(r.id)}" ${sel.has(r.id) ? 'checked' : ''}></td>
            <td class="ed">${esc(r.label ?? r.id)}</td>
            <td>${r.newer ? '<span class="st new">新しい版</span>' : r.a === 'ok' ? '<span class="st ok">あり</span>' : r.a === 'gone' ? '<span class="st gone">公開終了</span>' : '<span class="st unk">未確認</span>'}</td>
            <td>${r.held ? `取得 ${esc(sourceDate(r.held))}${r.held.rows ? ` <span class="muted">${r.held.rows}行</span>` : ''}` : '<span class="muted">—</span>'}</td>
            <td>${r.held ? `<label class="switch" title="${src.single ? '1版のみのデータ' : 'アプリで使う'}"><input type="checkbox" data-enable="${id}" value="${esc(r.id)}" ${r.held.enabled !== false ? 'checked' : ''} ${src.single ? 'disabled' : ''}><span></span></label>` : '<span class="muted">—</span>'}</td>
          </tr>`).join('')}
        ${visible.length === 0 ? '<tr><td colspan="5" class="muted">版がありません。「配布元を確認」してください</td></tr>' : ''}
        </tbody>
      </table>
    </div>
    <div class="bulk">
      ${hidden ? `<button class="link" data-act="showall" data-ds="${id}">古い未取得の版も表示（${hidden}）</button>` : showAll.has(id) ? `<button class="link" data-act="showall" data-ds="${id}">保持中と新しい版だけ表示</button>` : ''}
      <span class="muted">${sel.size ? `${sel.size} 件選択:` : ''}</span>
      ${sel.size ? `
        <button class="primary" data-act="get" data-ds="${id}" ${canGet ? '' : 'disabled'}>取得</button>
        <button class="danger" data-act="remove" data-ds="${id}" ${canHeld && !src.single ? '' : 'disabled'}>削除</button>` : ''}
    </div>
    ${issues.length ? `<ul class="issues">${issues.map(r => `<li class="${r.level}">${r.edition ? `<b>${esc(r.edition)}</b> ` : ''}${linkify(r.message)}</li>`).join('')}</ul>` : ''}
    ${oks.length ? `<details class="oks"><summary>OK のチェック ${oks.length} 件</summary><ul class="issues">${oks.map(r => `<li>${r.edition ? `<b>${esc(r.edition)}</b> ` : ''}${esc(r.message)}</li>`).join('')}</ul></details>` : ''}
    <div class="note">${esc(src.note ?? '')} ・ <a href="${esc(src.page)}" target="_blank" rel="noopener">配布ページ</a></div>
    <div class="row">
      <button data-act="discover" data-ds="${id}">配布元を確認</button>
      ${newer.length ? `<button class="primary" data-act="newer" data-ds="${id}">新しい版を取得（${newer.length}）</button>` : ''}
      <button data-act="update" data-ds="${id}" title="保持中の版をキャッシュから作り直す">${src.discover === 'curated' ? 'ビルド' : '作り直す'}</button>
    </div>
  </section>`
}

const sourceDate = (e) => (Array.isArray(e.source) ? e.source[0] : e.source)?.retrieved_at ?? (e.source?.manual ? '手作業' : '—')

function setBusy(b) {
  busy = b
  document.querySelectorAll('button[data-act]:not([data-act=showall]), input[data-enable]').forEach(el => {
    if (b) { el.dataset.wasDisabled = el.disabled ? '1' : ''; el.disabled = true }
    else if (el.dataset.wasDisabled !== undefined) { el.disabled = el.dataset.wasDisabled === '1'; delete el.dataset.wasDisabled }
  })
}

async function post(url, body) {
  return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Pipeline-UI': '1' }, body: JSON.stringify(body) })
}

async function runCommand(body, title) {
  if (busy) return
  setBusy(true)
  const log = $('#log')
  log.textContent = ''
  $('#logwrap').hidden = false
  document.body.classList.add('logopen')
  $('#logtitle').textContent = `実行中: ${title}`
  try {
    const res = await post('/api/run', body)
    if (!res.ok) { log.textContent = (await res.json()).error; return }
    const reader = res.body.getReader()
    const dec = new TextDecoder()
    for (;;) {
      const { value, done } = await reader.read()
      if (done) break
      log.textContent += dec.decode(value, { stream: true })
      log.scrollTop = log.scrollHeight
    }
  } catch (e) {
    log.textContent += `\n${e.message}`
  } finally {
    $('#logtitle').textContent = `完了: ${title}`
    await load()
  }
}

function heavyWarning(id, ids) {
  const src = state.manifest[id]
  if (!src.heavy) return true
  const sizes = rowsOf(id).filter(r => ids.includes(r.id)).map(r => r.size).filter(Boolean)
  return confirm(`${src.label} を ${ids.length} 版取得します${sizes.length ? `（${sizes.join(', ')}）` : ''}。ダウンロードと生成に数分かかります。続けますか？`)
}

document.addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-act]')
  if (!b) return
  const { act, ds } = b.dataset
  const src = state.manifest[ds]
  const ids = [...(selected[ds] ?? [])]
  if (act === 'showall') { showAll.has(ds) ? showAll.delete(ds) : showAll.add(ds); return render() }
  if (act === 'check') return runCommand({ command: 'check' }, 'チェック')
  if (act === 'discover') return runCommand({ command: 'discover', dataset: ds }, `配布元を確認 ${ds === 'all' ? '（すべて）' : src.label}`)
  if (act === 'update') return runCommand({ command: 'update', dataset: ds }, `${src.label} を作り直す`)
  if (act === 'newer') {
    const newer = rowsOf(ds).filter(r => r.newer).map(r => r.id)
    if (!heavyWarning(ds, newer)) return
    return runCommand({ command: 'get', dataset: ds, newer: true }, `${src.label} の新しい版を取得`)
  }
  if (act === 'get') {
    if (!heavyWarning(ds, ids)) return
    selected[ds].clear()
    return runCommand({ command: 'get', dataset: ds, editions: ids }, `${src.label} ${ids.join(', ')} を取得`)
  }
  if (act === 'remove') {
    const left = (state.meta.datasets[ds]?.editions ?? []).filter(x => !ids.includes(x.id) && x.enabled !== false)
    const msg = `${src.label} の ${ids.join(', ')} をリポジトリから削除します（生データのキャッシュは残ります）。` +
      (left.length === 0 ? '\n\n注意: 有効な版が残らないため、アプリがこのデータを読めなくなります。' : '')
    if (!confirm(msg)) return
    selected[ds].clear()
    return runCommand({ command: 'remove', dataset: ds, editions: ids }, `${src.label} ${ids.join(', ')} を削除`)
  }
})

document.addEventListener('change', async (e) => {
  const t = e.target
  if (t.dataset.sel) {
    const s = selected[t.dataset.sel]
    t.checked ? s.add(t.value) : s.delete(t.value)
    return render()
  }
  if (t.dataset.selall) {
    const id = t.dataset.selall
    const rows = showAll.has(id) ? rowsOf(id) : rowsOf(id).filter(r => r.held || r.newer)
    rows.forEach(r => t.checked ? selected[id].add(r.id) : selected[id].delete(r.id))
    return render()
  }
  if (t.dataset.enable) {
    if (busy) return
    t.disabled = true
    const res = await post('/api/enabled', { dataset: t.dataset.enable, editions: [t.value], enabled: t.checked })
    if (!res.ok) alert((await res.json()).error)
    await load()
  }
})

$('#logclose').addEventListener('click', () => {
  if (busy) return
  $('#logwrap').hidden = true
  document.body.classList.remove('logopen')
})

load().catch(e => { $('#sub').textContent = `読み込みに失敗しました: ${e.message}` })
</script>
</body>
</html>
